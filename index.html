<title>Cirgo Pemesanan</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F6FB"><script>try{var t=localStorage.getItem("cirgo_theme");if(t!=="light"&&t!=="ivory"&&t!=="dark")t="light";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: aplikasi satu kolom ala ponsel (maks 520px) dengan navigasi bawah. Gerbang masuk/daftar (kode dari admin) di depan; WhatsApp selalu terbuka. Navy + emas dari profil merek Cirgo. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#0F1B33; --muted:#566282; --line:#D8DEEA;
  --panel-bg:#14284B; --panel-fg:#F3F5FA; --panel-muted:#B6C2DD;
  --gold:#D6A33A; --gold-ink:#7C5710; --on-gold:#14284B;
  --wa:#1E8F4E; --on-wa:#FFFFFF;
  --ok:#1D7449; --ok-bg:#E4F3EB; --warn:#9A5806; --warn-bg:#FBF0DC;
  --focus:#2D5BD1;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root[data-theme="dark"]{
  --bg:#0A1325; --surface:#121E37; --ink:#EDF1FA; --muted:#9DAAC8; --line:#243452;
  --panel-bg:#0E1B35; --panel-fg:#EDF1FA; --panel-muted:#9DAAC8;
  --gold:#E3B04B; --gold-ink:#E3B04B; --on-gold:#14284B;
  --wa:#2FB36A; --on-wa:#06210F;
  --ok:#5CC592; --ok-bg:#123023; --warn:#EBB158; --warn-bg:#33270F;
  --focus:#7FA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1325; --surface:#121E37; --ink:#EDF1FA; --muted:#9DAAC8; --line:#243452;
  --panel-bg:#0E1B35; --panel-fg:#EDF1FA; --panel-muted:#9DAAC8;
  --gold:#E3B04B; --gold-ink:#E3B04B; --on-gold:#14284B;
  --wa:#2FB36A; --on-wa:#06210F;
  --ok:#5CC592; --ok-bg:#123023; --warn:#EBB158; --warn-bg:#33270F;
  --focus:#7FA2FF; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-width:0}
h1,h2,h3{margin:0}
.mark{font:600 30px/1 var(--f-display);letter-spacing:-.02em}
.mark i{font-style:normal;color:var(--gold)}
.tag{margin:6px 0 0;font:600 12px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

.authhead{background:var(--panel-bg);color:var(--panel-fg);margin-inline:-16px;padding:28px 16px 26px}
.authhead p.lead{margin:14px 0 0;color:var(--panel-muted);max-width:36ch}
.proto{display:inline-block;margin-top:14px;padding:4px 10px;border:1px dashed var(--gold);color:var(--gold);font:600 11px/1.4 var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:22px 0 18px;border-bottom:2px solid var(--line)}
.tab{min-height:46px;border:0;background:transparent;color:var(--muted);font:600 15px var(--f-body);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.wa-card{margin:22px 0 28px;padding:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:10px}
.wa-card h3{font:600 17px/1.25 var(--f-display)}
.wa-card p{margin:0;color:var(--muted);font-size:14px}

fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}
legend{padding:0;margin-bottom:10px;font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:6px;margin-bottom:14px}
label{font-weight:600}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
select,input[type=text],input[type=tel],input[type=password],input[type=datetime-local]{
  width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit}
input.code{font:600 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;text-align:center}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.route{display:grid;gap:10px;grid-template-columns:1fr}
.swap{justify-self:start;min-height:36px;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border:0;border-radius:8px;
  background:var(--gold);color:var(--on-gold);font:600 16px var(--f-body);cursor:pointer;width:100%;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:var(--wa);color:var(--on-wa)}
.btn svg,.nav svg,.card svg,.hero svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.err{color:var(--warn);font-size:13px;min-height:1.2em;margin:8px 0 0}
.linkbtn{display:inline-block;background:none;border:0;padding:6px 0;color:var(--gold-ink);font:600 14px var(--f-body);cursor:pointer;text-decoration:underline}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 6px}
.top .hi{color:var(--muted);font-size:14px}
.top .nm{font:600 22px/1.15 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.top .mark{font-size:24px}
.pane{padding-block:14px 120px;min-width:0}
.pane > h1{font:600 24px/1.15 var(--f-display);letter-spacing:-.015em;margin-bottom:4px}
.sub{margin:0 0 20px;color:var(--muted)}
.hero{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;width:100%;text-align:left;padding:18px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;margin:12px 0 14px}
.hero .ic{display:grid;place-items:center;width:52px;height:52px;border-radius:10px;background:var(--gold);color:var(--on-gold)}
.hero .ic svg{width:26px;height:26px}
.hero b{display:block;font:600 22px/1.15 var(--f-display)}
.hero span.t{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:grid;gap:10px;align-content:start;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-width:0;text-decoration:none}
.card:hover,.hero:hover{border-color:var(--gold)}
.card .ic{color:var(--gold-ink)}
.card b{font:600 17px/1.2 var(--f-display)}
.card span.t{color:var(--muted);font-size:13.5px;line-height:1.4}
.card.wa .ic{color:var(--wa)}

.price{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 16px 14px;margin-bottom:22px}
.price .lbl{font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.price .amt{margin:8px 0 2px;font:600 40px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price .note{margin:0;color:var(--muted);font-size:13.5px}
.price.ok{border-color:var(--ok)} .price.ok .lbl{color:var(--ok)}
.price.contact{border-color:var(--warn);background:var(--warn-bg)} .price.contact .lbl{color:var(--warn)} .price.contact .amt{font-size:28px}
.price.empty .amt{color:var(--muted);font-size:22px;font-weight:600}
.pill{display:inline-block;margin-top:10px;padding:3px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font:600 12px/1.5 var(--f-body)}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.help-inline{margin:14px 0 0;text-align:center;color:var(--muted);font-size:14px}

.panel{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:18px;display:grid;gap:12px}
.panel.okb{border-color:var(--ok)}
.panel h2{font:600 20px/1.2 var(--f-display)}
.panel p{margin:0;color:var(--muted)}
.msg{margin:0;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:grid;gap:10px;grid-template-columns:1fr}
.count{font:600 30px/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:center}
.amtbig{font:600 34px/1 var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.qrwrap{display:grid;justify-items:center;gap:8px}
.qr{background:#fff;padding:12px;border-radius:10px;border:1.5px solid var(--line);width:220px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.qrcap{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.status{padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:600;text-align:center}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.bk{font:600 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.list{display:grid;gap:0;margin:0 0 22px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{overflow-wrap:anywhere}

details.proto-notes{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:13.5px}
details.proto-notes summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.proto-notes ul{margin:10px 0 0;padding-left:18px;display:grid;gap:4px}

.nav{position:fixed;left:0;right:0;bottom:0;margin-inline:auto;width:min(520px,100%);z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.nav button{display:grid;justify-items:center;gap:2px;min-height:50px;padding:4px 2px;border:0;background:transparent;color:var(--muted);font:600 11.5px var(--f-body);cursor:pointer}
.nav button[aria-current="page"]{color:var(--gold-ink)}
.nav .plus .dot{display:grid;place-items:center;width:56px;height:56px;margin-top:-26px;border-radius:50%;background:var(--gold);color:var(--on-gold);box-shadow:0 6px 18px rgba(0,0,0,.25);border:4px solid var(--surface)}
.nav .plus .dot svg{width:26px;height:26px;stroke-width:2.2}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,12,26,.66);display:grid;place-items:end center;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:14px 14px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) 18px;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 4px;font:600 20px/1.2 var(--f-display)}
.sheet .ver{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.sheet ol{margin:0 0 16px;padding-left:20px;display:grid;gap:10px}
.agree{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:14px;cursor:pointer}
.agree input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--gold)}
.sheet .btn{min-height:46px}
@media (min-width:600px){ .overlay{place-items:center} .sheet{border-radius:14px} }
@media (min-width:560px){ .route{grid-template-columns:1fr 1fr} .swap{grid-column:1/-1} .authhead{margin-inline:0;border-radius:0 0 14px 14px} }
@media (prefers-reduced-motion:no-preference){ .price,.panel{animation:rise .25s ease-out} @keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}} }
.field{position:relative}.eye{position:absolute;right:6px;bottom:6px;width:40px;height:40px;border:0;background:transparent;color:var(--muted,#566282);cursor:pointer;display:grid;place-items:center;border-radius:10px}.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}input[type=password],input.pwshow{padding-right:50px}.steps{display:flex;gap:4px;margin:6px 0 2px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line,#D8DEEA)}.steps i.on{background:var(--gold,#E0B04A)}.authhead{display:grid;place-items:center;background:#F6F3EC;padding:30px 16px 22px;border-bottom:3px solid #B8975A}.logocard{width:min(330px,100%)}.logocard img{display:block;width:100%;height:auto}.top .appicon{width:34px;height:34px;border-radius:9px;display:block}
/* ===== Tampilan Cirgo: navy, emas, putih gading; huruf Jost ===== */
:root{--bg:#F6F3EC;--surface:#FFFDF9;--ink:#0F1B2D;--muted:#4A5568;--line:#E3DCCB;--panel-bg:#0F1B2D;--panel-fg:#F6F3EC;--panel-muted:#B9C0CE;
  --gold:#B8975A;--gold-ink:#7F6329;--on-gold:#0F1B2D;--btn-bg:#0F1B2D;--btn-fg:#F6F3EC;--f-display:"Jost",system-ui,sans-serif;--f-body:"Jost",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root[data-theme="dark"]{--bg:#0A121F;--surface:#111D2F;--ink:#F1EDE3;--muted:#A9B2C3;--line:#223148;--gold:#CDAA6A;--gold-ink:#CDAA6A;--btn-bg:#CDAA6A;--btn-fg:#0F1B2D}}
body{font-size:16.5px;letter-spacing:.005em;background:var(--bg)}
h1,h2,h3,.top .nm,.hero b,.card b,.panel h2,.sheet h2,.price .amt,.wa-card h3{font-weight:500;letter-spacing:-.01em}
.btn{background:var(--btn-bg);color:var(--btn-fg);border-radius:14px;font-weight:600;min-height:52px;letter-spacing:.01em}
.btn.wa{background:var(--wa);color:var(--on-wa)}.btn.ghost{background:transparent;color:var(--ink)}
select,input[type=text],input[type=tel],input[type=password],input[type=datetime-local],input[type=number]{border-radius:12px;background:var(--surface);border-color:var(--line);font-size:16.5px}
.tab[aria-selected="true"]{border-bottom-color:var(--gold)}
.wa-card,.panel,.price{border-radius:16px;background:var(--surface);border-color:var(--line)}
.authhead{display:grid;place-items:center;background:#F6F3EC;padding:34px 16px 24px;border-bottom:0;position:relative}
.authhead::after{content:"";position:absolute;left:50%;bottom:0;width:56px;height:3px;margin-left:-28px;background:var(--gold);border-radius:3px}
.logocard{width:min(330px,100%)}.logo{display:block;width:100%;height:auto}
.top{padding:22px 0 14px}.top .hi{font-size:15px;color:var(--muted)}.top .nm{font-size:26px}
.top .appicon{width:40px;height:40px;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
/* hero rute: satu elemen utama di beranda */
.route-hero{position:relative;overflow:hidden;display:grid;gap:18px;width:100%;text-align:left;padding:26px 22px 22px;border:0;border-radius:24px;background:#0F1B2D;color:#F6F3EC;font:inherit;cursor:pointer;margin-bottom:18px}
.route-hero .watermark{position:absolute;right:-46px;top:-30px;width:210px;height:210px;color:#B8975A;opacity:.22;pointer-events:none}
.rh-title{position:relative;font:500 34px/1.05 var(--f-display);letter-spacing:-.02em}
.rh-route{position:relative;display:grid;grid-template-columns:14px 1fr;column-gap:14px;row-gap:22px;align-items:center;padding:4px 0}
.rh-route .dot{grid-column:1;width:12px;height:12px;border-radius:50%;background:#B8975A;justify-self:center;z-index:1}
.rh-route .dot.a{grid-row:1}.rh-route .dot.b{grid-row:2;background:transparent;border:2.5px solid #B8975A}
.rh-route .line{position:absolute;left:6px;top:17px;bottom:17px;border-left:2px dashed rgba(184,151,90,.7)}
.rh-route .s1,.rh-route .s2{grid-column:2;color:#F6F3EC;font-size:18px;line-height:1.2;padding-bottom:9px;border-bottom:1px solid rgba(246,243,236,.18)}
.rh-route .s1{grid-row:1}.rh-route .s2{grid-row:2}
.rh-route small{display:block;font-size:13px;color:#B9C0CE;margin-bottom:2px}
.rh-go{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:14px;background:#B8975A;color:#0F1B2D;font:600 17px var(--f-body)}
.rh-go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){:root[data-theme="dark"] .route-hero{background:#13233B;box-shadow:0 0 0 1px #223148}}
/* daftar menu: baris, bukan kartu kembar */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row2{display:grid;grid-template-columns:44px 1fr 20px;gap:14px;align-items:center;width:100%;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.row2:last-child{border-bottom:0}.row2:active{background:rgba(184,151,90,.1)}
.row2 .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(184,151,90,.16);color:var(--gold-ink)}
.row2 .ic.wa{background:rgba(30,143,78,.14);color:var(--wa)}
.row2 .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row2 b{display:block;font:500 18px/1.2 var(--f-display)}.row2 .t{display:block;color:var(--muted);font-size:14.5px;line-height:1.35;margin-top:2px}
.row2 .chev{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* navigasi bawah */
.nav{background:var(--surface);border-top:1px solid var(--line)}
.nav button{font-size:12px;font-weight:500}.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav button[aria-current="page"] svg{color:var(--gold-ink)}
.nav .plus .dot{background:#0F1B2D;color:#CDAA6A;border-color:var(--bg)}
@media (prefers-color-scheme:dark){:root[data-theme="dark"] .nav .plus .dot{background:#CDAA6A;color:#0F1B2D}}
.status{border-radius:12px}.price.ok{border-color:var(--gold)}.price.ok .lbl{color:var(--gold-ink)}

/* ===== daftar pesanan, pelacakan, bayar, animasi ===== */
.back{justify-self:start;border:0;background:none;color:var(--gold-ink);font:500 15px var(--f-body);padding:4px 0;cursor:pointer}
.hs{font:500 18px var(--f-display);margin:18px 0 8px}
.oi{display:grid;gap:3px;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.oi.act{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.oi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.oi-top b{font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.06em}
.chip{font:500 12.5px var(--f-body);padding:3px 10px;border-radius:99px;background:rgba(184,151,90,.18);color:var(--gold-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--warn-bg);color:var(--warn)}
.oi-route{font:500 17px var(--f-display)}.oi-route i{font-style:normal;color:var(--gold-ink)}.oi-meta{font-size:14px;color:var(--muted)}
.emptyo{display:grid;gap:8px;justify-items:center;text-align:center;padding:36px 12px;color:var(--muted)}.emptyo b{font:500 20px var(--f-display);color:var(--ink)}
